name: Robô Previsão Goiânia

on:
  schedule:
    # 9h de Brasília = 12h UTC
    - cron: '0 12 * * *'
  # Permite disparar o robô manualmente pelo botão no GitHub quando quiser testar
  workflow_dispatch:

# Permissão explícita para o robô salvar e atualizar arquivos no repositório
permissions:
  contents: write

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    steps:
      # 1. Copia os arquivos do repositório para o servidor da nuvem
      - name: Baixar código
        uses: actions/checkout@v4

      # 2. Prepara o Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Instala as bibliotecas necessárias
      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas matplotlib

      # 4. Roda o script
      - name: Gerar gráfico
        run: python gerar_grafico.py

      # 5. Salva a imagem gerada no repositório
      - name: Commit e Push da imagem
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add previsao_goiania.png
          git commit -m "Atualização automática: gráfico de Goiânia" || exit 0
          git push
